[package]
name = "todo-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# 许可未定（见 NOTICE.md）。选定许可证前禁止发布到 crates.io。
publish = false

[lib]
name = "todo_cli"
path = "src/lib.rs"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
todo-core = { path = "../todo-core" }
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
libc.workspace = true

[dev-dependencies]
fs2.workspace = true
tempfile.workspace = true
