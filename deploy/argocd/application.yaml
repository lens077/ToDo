# ArgoCD Application：渲染本仓库 main 分支上的 Helm chart。
# CI 在 main 发布时回写 values-prod.yaml 的镜像 tag；ArgoCD 轮询（默认 3 分钟）
# 或收到 GitHub webhook 后自动同步。selfHeal 把手工改动拉回 Git 的状态。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: virgo-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: virgo
    app.kubernetes.io/managed-by: git
    app.kubernetes.io/environment: prod
spec:
  project: virgo
  source:
    repoURL: git@github.com:lens077/ToDo.git
    targetRevision: main
    path: web/deploy/chart/virgo
    helm:
      releaseName: virgo
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: virgo
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  revisionHistoryLimit: 10
  info:
    - name: source
      value: github.com/lens077/ToDo, web/deploy/chart/virgo
