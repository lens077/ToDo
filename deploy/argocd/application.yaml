# ArgoCD Application：渲染 GitLab 镜像仓库 main 分支上的 Helm chart。
# 集群连 GitHub 不稳定，所以源是 GitLab：CI 回写镜像 tag 后把 main 快进推到
# GitLab，ArgoCD 每 3 分钟轮询。selfHeal 把手工改动拉回 Git 的状态。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: virgo-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: virgo
    app.kubernetes.io/managed-by: git
    app.kubernetes.io/environment: prod
spec:
  project: virgo
  source:
    repoURL: https://gitlab.com/sumery/virgo.git
    targetRevision: main
    path: web/deploy/chart/virgo
    helm:
      releaseName: virgo
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: virgo
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  revisionHistoryLimit: 10
  info:
    - name: source
      value: gitlab.com/sumery/virgo (GitHub lens077/ToDo 的部署镜像), web/deploy/chart/virgo
