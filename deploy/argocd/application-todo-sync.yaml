# ArgoCD Application：渲染 todo-sync（链接库同步/解析服务）的 Helm chart。
# 与 virgo-prod / sponsor-api-prod 同一 GitLab 部署镜像仓库，路径
# apps/sync-server/deploy/chart/todo-sync，落到 todo 命名空间。
#
# 首次注册前先确认：
#   - Secret todo-sync-token 已存在（make sync-secret）
#   - values-prod.yaml 的 api.image.tag 已回写为在跑的镜像
# 之后 tag 变化由 CI 回写 values-prod.yaml，ArgoCD 每 3 分钟轮询并自动同步。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-sync-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: virgo
    app.kubernetes.io/managed-by: git
    app.kubernetes.io/environment: prod
spec:
  project: virgo
  source:
    repoURL: https://gitlab.com/sumery/virgo.git
    targetRevision: main
    path: apps/sync-server/deploy/chart/todo-sync
    helm:
      releaseName: todo-sync
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: todo
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  revisionHistoryLimit: 10
  info:
    - name: source
      value: gitlab.com/sumery/virgo (GitHub lens077/ToDo 的部署镜像), apps/sync-server/deploy/chart/todo-sync
    - name: data
      value: PVC todo-sync-data（RWO，单副本，滚动更新先杀后起）
