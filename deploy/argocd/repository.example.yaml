# ArgoCD 读取私有 GitLab 镜像仓库的凭据。这是模板，真实 token 不入库：
# 1. 在 GitLab 项目 sumery/virgo 创建 Project Access Token，scope 只勾 read_repository
# 2. kubectl -n argocd create secret generic repo-gitlab-virgo \
#      --from-literal=type=git \
#      --from-literal=url=https://gitlab.com/sumery/virgo.git \
#      --from-literal=username=oauth2 \
#      --from-literal=password=<token> \
#      --from-literal=name=gitlab-virgo \
#      --from-literal=project=virgo
# 3. kubectl -n argocd label secret repo-gitlab-virgo \
#      argocd.argoproj.io/secret-type=repository
apiVersion: v1
kind: Secret
metadata:
  name: repo-gitlab-virgo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  name: gitlab-virgo
  project: virgo
  url: https://gitlab.com/sumery/virgo.git
  username: oauth2
  password: <read_repository project access token>
