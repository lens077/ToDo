# ArgoCD 读取私有 GitHub 仓库的凭据。这是模板，真实私钥不入库：
# 1. ssh-keygen -t ed25519 -f /tmp/todo-argocd -N ''
# 2. gh repo deploy-key add /tmp/todo-argocd.pub --title argocd --allow-write=false
# 3. kubectl -n argocd create secret generic repo-github-todo \
#      --from-literal=type=git \
#      --from-literal=url=git@github.com:lens077/ToDo.git \
#      --from-literal=name=github-todo \
#      --from-literal=project=virgo \
#      --from-literal=sshPrivateKey="$(cat /tmp/todo-argocd)"
# 4. kubectl -n argocd label secret repo-github-todo \
#      argocd.argoproj.io/secret-type=repository
apiVersion: v1
kind: Secret
metadata:
  name: repo-github-todo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  name: github-todo
  project: virgo
  url: git@github.com:lens077/ToDo.git
  sshPrivateKey: <read-only deploy key>
