# 生产环境（hosting 集群，namespace virgo）。ArgoCD Application virgo-prod
# 叠加 values.yaml + 本文件渲染。
#
# image.tag 由 .github/workflows/deploy.yml 在每次 main 分支发布时改写为
# "<git sha>@sha256:<digest>"。手工回滚：改回旧值提交即可，ArgoCD 自动同步。

web:
  image:
    tag: "b75431e75f47368d781edbaee2bdb2b7593ab0b1@sha256:0000b00d64c970faa4f9813cb0bf59da50c5353689427ca2be87ee8282a3475e"
  # 集群里已有从 scorpius 复制的 tcr-pull。OpenBao 的写入权限还没配：
  # 配好 `k8s/hosting/virgo`（属性 tcr-dockerconfigjson）后，把下面两行删掉，
  # imagePullSecret 改回 virgo-tcr，ExternalSecret 就会接管这个凭据。
  imagePullSecret: tcr-pull
  externalSecret:
    enabled: false

route:
  hostnames:
    - virgo.apikv.com
