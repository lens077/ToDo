# 生产环境（hosting 集群，namespace virgo）。ArgoCD Application virgo-prod
# 叠加 values.yaml + 本文件渲染。
#
# image.tag 由 .github/workflows/deploy.yml 在每次 main 分支发布时改写为
# "<git sha>@sha256:<digest>"。手工回滚：改回旧值提交即可，ArgoCD 自动同步。

web:
  image:
    tag: "2d4ddb3fe7c001172ac21a6b29839965865271be@sha256:5b5b6ae6774ce518db7f957ada60b444af86f126a88bea8750df9c4c09eda58b"
  # TCR 拉取凭据由 OpenBao 的 k8s/hosting/virgo 经 ESO 生成，不再手工维护 Secret。
  imagePullSecret: virgo-tcr
  externalSecret:
    enabled: true

route:
  hostnames:
    - virgo.apikv.com
