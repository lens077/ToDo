{{- if .Values.web.externalSecret.enabled -}}
{{- $name := include "virgo.fullname" . -}}
# TCR 拉取凭据。OpenBao 路径与属性见 values.yaml；密钥由 ESO 生成，
# 不进入 Git，也不在 values 里出现。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.web.imagePullSecret }}
  labels:
    {{- include "virgo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.web.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.web.externalSecret.storeName }}
    kind: {{ .Values.web.externalSecret.storeKind }}
  target:
    name: {{ .Values.web.imagePullSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Values.web.externalSecret.remoteKey }}
        property: {{ .Values.web.externalSecret.remoteProperty }}
{{- end }}
