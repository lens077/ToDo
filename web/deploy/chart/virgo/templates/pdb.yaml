{{- if .Values.podDisruptionBudget.enabled -}}
{{- $name := include "virgo.fullname" . -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "virgo.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "virgo.selector" . | nindent 6 }}
{{- end }}
