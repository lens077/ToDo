[workspace]
members = ["crates/todo-core", "crates/todo-cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.74"

[workspace.dependencies]
pulldown-cmark = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
proptest = "1.6"
tempfile = "3.14"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
