[workspace]
members = ["crates/todo-core", "crates/todo-cli", "crates/sync-server", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
pulldown-cmark = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
proptest = "1.6"
tempfile = "3.14"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6.0"
ignore = "0.4"
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
# Android 上没有随包提供 rustls-platform-verifier 的 Kotlin 组件，reqwest 的
# 默认校验器会在第一次 HTTPS 请求时 panic；改用随包根证书。
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1.0"
readabilityrs = "0.1.4"
ammonia = "4.2"
htmd = "0.5"
encoding_rs = "0.8"
regex = "1"

# Ship-ready release profile for the desktop bundle. `strip` drops the symbol
# table (measured ~6.3 MB off the macOS binary) and cannot change behavior;
# `lto`/`codegen-units` trade build time for a smaller binary.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
