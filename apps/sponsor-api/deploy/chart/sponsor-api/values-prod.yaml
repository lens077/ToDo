# 生产环境（hosting 集群，namespace virgo）。ArgoCD Application
# sponsor-api-prod 叠加 values.yaml + 本文件渲染。
#
# image.tag 更新为 "<git sha>@sha256:<digest>"。目前手工回写：make
# sponsor-image（裸 sha tag）推送后用 imagetools 抓 digest 回写到这里；
# CI 自动回写只覆盖 virgo 站图，未覆盖本图。手工回滚：改回旧值提交即可，
# ArgoCD 自动同步。

api:
  image:
    tag: "9f8bd4e@sha256:92ba1fda2b2501a8948c1e6bd031e98093622e9dbe12c786fcd092078219d42b"

route:
  hostnames:
    - sponsor-api.apikv.com

config:
  # 电脑网站支付签约已通过（2026-11-12），切生产网关；凭据为正式应用。
  gateway: https://openapi.alipay.com/gateway.do
