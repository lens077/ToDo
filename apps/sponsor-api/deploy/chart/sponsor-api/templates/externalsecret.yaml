{{- if .Values.alipaySecret.externalSecret.enabled -}}
{{- $props := .Values.alipaySecret.externalSecret.properties -}}
# 支付宝凭据。OpenBao 路径与属性见 values.yaml；密钥由 ESO 生成，
# 不进入 Git，也不在 values 里出现。应用私钥是 PKCS#1（Node.js）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.alipaySecret.name }}
  labels:
    {{- include "sponsor.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.alipaySecret.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.alipaySecret.externalSecret.storeName }}
    kind: {{ .Values.alipaySecret.externalSecret.storeKind }}
  target:
    name: {{ .Values.alipaySecret.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ $props.appId }}
      remoteRef:
        key: {{ .Values.alipaySecret.externalSecret.remoteKey }}
        property: {{ $props.appId }}
    - secretKey: {{ $props.privateKey }}
      remoteRef:
        key: {{ .Values.alipaySecret.externalSecret.remoteKey }}
        property: {{ $props.privateKey }}
    - secretKey: {{ $props.publicKey }}
      remoteRef:
        key: {{ .Values.alipaySecret.externalSecret.remoteKey }}
        property: {{ $props.publicKey }}
    - secretKey: {{ $props.sellerPid }}
      remoteRef:
        key: {{ .Values.alipaySecret.externalSecret.remoteKey }}
        property: {{ $props.sellerPid }}
{{- end }}
