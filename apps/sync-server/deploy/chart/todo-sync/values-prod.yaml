# 生产环境（k1 集群，namespace todo）。ArgoCD Application todo-sync-prod
# 叠加 values.yaml + 本文件渲染。
#
# image.tag 由 CI（或手工 make sync-image 后回写）更新为
# "<git sha>@sha256:<digest>"。手工回滚：改回旧值提交即可，ArgoCD 自动同步。

api:
  image:
    tag: ""   # 首次部署前回写，如 "abc1234@sha256:..."

route:
  hostnames:
    - todo-sync.apikv.com
