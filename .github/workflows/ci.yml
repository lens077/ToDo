name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Rust toolchain
        id: rust-version
        shell: bash
        run: |
          rust_version="$(awk -F '"' '/^channel = "/ { print $2; exit }' rust-toolchain.toml)"
          test -n "$rust_version"
          printf 'version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-key: workspace

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Report Rust toolchain
        run: rustc --version && cargo --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read MSRV from Cargo.toml
        id: rust-version
        shell: bash
        run: |
          rust_version="$(awk -F '"' '/^rust-version = "/ { print $2; exit }' Cargo.toml)"
          test -n "$rust_version"
          printf 'version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"
          # Override rust-toolchain.toml for both Cargo and the cache action.
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$rust_version" >> "$GITHUB_ENV"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Cache MSRV build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-key: workspace-msrv

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Report MSRV toolchain
        run: rustc --version && cargo --version

      - name: Test locked workspace on MSRV
        run: cargo test --workspace --locked

  web:
    name: Web and Playwright gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Report JavaScript toolchain
        run: node --version && pnpm --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Web application
        run: pnpm typecheck

      - name: Build Web application
        run: pnpm build

      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          playwright_version="$(node -p "require('@playwright/test/package.json').version")"
          printf 'version=%s\n' "$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright interaction tests
        run: pnpm e2e

      - name: Reject whitespace errors
        run: git diff --check

  web-live:
    name: Live todo serve E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read pinned Rust toolchain
        id: rust-version
        shell: bash
        run: |
          rust_version="$(awk -F '"' '/^channel = "/ { print $2; exit }' rust-toolchain.toml)"
          test -n "$rust_version"
          printf 'version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-key: workspace

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Report toolchains
        run: node --version && pnpm --version && rustc --version && cargo --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          playwright_version="$(node -p "require('@playwright/test/package.json').version")"
          printf 'version=%s\n' "$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright tests against todo serve
        run: ./scripts/e2e-web.sh
