name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read Rust version from Cargo.toml
        id: rust-version
        shell: bash
        run: |
          rust_version="$(awk -F '"' '/^rust-version = "/ { print $2; exit }' Cargo.toml)"
          if [[ -z "$rust_version" ]]; then
            echo "::error::Cargo.toml does not define workspace.package.rust-version"
            exit 1
          fi
          printf 'version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: workspace

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  web:
    name: Web and Playwright gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Web application
        run: pnpm typecheck

      - name: Build Web application
        run: pnpm build

      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          playwright_version="$(node -p "require('@playwright/test/package.json').version")"
          printf 'version=%s\n' "$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright interaction tests
        run: pnpm e2e

      - name: Reject whitespace errors
        run: git diff --check

  web-live:
    name: Live todo serve E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Rust version from Cargo.toml
        id: rust-version
        shell: bash
        run: |
          rust_version="$(awk -F '"' '/^rust-version = "/ { print $2; exit }' Cargo.toml)"
          if [[ -z "$rust_version" ]]; then
            echo "::error::Cargo.toml does not define workspace.package.rust-version"
            exit 1
          fi
          printf 'version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          shared-key: workspace

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          playwright_version="$(node -p "require('@playwright/test/package.json').version")"
          printf 'version=%s\n' "$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright tests against todo serve
        run: ./scripts/e2e-web.sh
