name: rust-check

# Rust 质量门禁的远程复检：本地 pre-push hook 可被绕过，CI 必须独立
# 重新执行同样的强制规则（fmt/clippy/test + Project Contract 校验）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: contract check
        run: cargo run --quiet --locked -p todo-cli -- contract check --root .
