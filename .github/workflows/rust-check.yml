name: rust-check

# Rust 质量门禁的远程复检：本地 pre-push hook 可被绕过，CI 必须独立
# 重新执行同样的强制规则（fmt/clippy/test + Project Contract 校验）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      # workspace 含 Tauri 2 桌面端，Linux CI 需 GTK/WebKit 系统库才能编译
      # apt 偶发 DNS 解析失败且会长时间挂起，加重试并限时
      - name: Install Tauri Linux dependencies
        run: |
          for i in 1 2 3; do
            timeout 300 sudo apt-get update && \
            timeout 300 sudo apt-get install -y \
              libglib2.0-dev libgtk-3-dev \
              libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
              librsvg2-dev libayatana-appindicator3-dev && break
            echo "apt attempt $i failed, retrying..."; sleep 15
          done
          test -f /usr/lib/x86_64-linux-gnu/pkgconfig/glib-2.0.pc
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: contract check
        run: cargo run --quiet --locked -p todo-cli -- contract check --root .
