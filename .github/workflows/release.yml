name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_OUTPUT_DIR: target/release-artifacts-${{ github.run_id }}

jobs:
  macos:
    name: Sign, notarize, and package macOS artifacts
    runs-on: macos-14
    environment: macos-release
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read Rust version from Cargo.toml
        id: rust-version
        shell: bash
        run: |
          rust_version="$(awk -F '"' '/^rust-version = "/ { print $2; exit }' Cargo.toml)"
          if [[ -z "$rust_version" ]]; then
            echo "::error::Cargo.toml does not define workspace.package.rust-version"
            exit 1
          fi
          printf 'version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app_version="$(node -e 'const fs = require("fs"); const config = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")); process.stdout.write(config.version);')"
          if [[ "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match application version v$app_version"
            exit 1
          fi

      - name: Verify signing and notarization secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required macos-release secret $name is missing"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build, sign, notarize, and package macOS artifacts
        env:
          OUTPUT_DIR: ${{ env.RELEASE_OUTPUT_DIR }}
          SIGN_AND_NOTARIZE: '1'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: ./scripts/package-macos.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: todo-macos-${{ github.run_id }}
          path: ${{ env.RELEASE_OUTPUT_DIR }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: todo-macos-${{ github.run_id }}
          path: release-assets

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
