name: Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_OUTPUT_DIR: target/release-artifacts-${{ github.run_id }}

jobs:
  macos:
    name: Build macOS artifacts
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Rust version from Cargo.toml
        id: rust-version
        shell: bash
        run: |
          rust_version="$(awk -F '"' '/^rust-version = "/ { print $2; exit }' Cargo.toml)"
          if [[ -z "$rust_version" ]]; then
            echo "::error::Cargo.toml does not define workspace.package.rust-version"
            exit 1
          fi
          printf 'version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app_version="$(node -e 'const fs = require("fs"); const config = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")); process.stdout.write(config.version);')"
          if [[ "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match application version v$app_version"
            exit 1
          fi

      - name: Build and package macOS artifacts
        env:
          OUTPUT_DIR: ${{ env.RELEASE_OUTPUT_DIR }}
        run: ./scripts/package-macos.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: todo-macos-${{ github.run_id }}
          path: ${{ env.RELEASE_OUTPUT_DIR }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_OUTPUT_DIR }}/*
          fail_on_unmatched_files: true
          generate_release_notes: true
